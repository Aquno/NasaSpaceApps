# Tool configuration only (the pipeline is a set of scripts, not an installable package).

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["web", "data"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: pyupgrade, D: docstrings
select = ["E", "F", "I", "B", "UP", "D"]
# Module headers follow our own template (docs/BOAS_PRATICAS.md), not pydocstyle's
# summary-line rules (D205, D212, D415).
ignore = ["D100", "D104", "D205", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"pipeline/tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
